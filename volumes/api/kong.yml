          origins:
            - "__CORS_ORIGIN__"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
            - apikey
            - x-supabase-api-version
            - x-client-info
            - accept-profile
            - content-profile
            - prefer
            - Range
            - Origin
            - Referer
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
          exposed_headers:
            - Content-Length
            - Content-Range
            - accept-ranges
            - Content-Type
            - Content-Profile
            - Range-Unit
          credentials: true
          max_age: 3600
  - name: postgrest
    url: http://__PROJECT_NAME__-rest:3000
    routes:
      - name: postgrest-route
        paths:
          - /
        strip_path: false
    plugins:
      - name: cors
        config:
