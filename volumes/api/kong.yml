_format_version: '2.1'
_transform: true

consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: __ANON_KEY__
  - username: service_role
    keyauth_credentials:
      - key: __SERVICE_ROLE_KEY__

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

basicauth_credentials:
  - consumer: DASHBOARD
    username: supabase
    password: __PROJECT_NAME__

services:
  - name: auth-v1
    url: http://__PROJECT_NAME__-auth:9999/verify
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
        config:
          origins:
            - "__CORS_ORIGIN__"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
            - apikey
            - x-supabase-api-version
            - x-client-info
            - accept-profile
            - content-profile
            - prefer
            - Range
            - Origin
            - Referer
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
          exposed_headers:
            - Content-Length
            - Content-Range
            - accept-ranges
            - Content-Type
            - Content-Profile
            - Range-Unit
          credentials: true
          max_age: 3600
  - name: auth-v1-api
    url: http://__PROJECT_NAME__-auth:9999
    routes:
      - name: auth-v1-api-route
        paths:
          - /auth/v1
    plugins:
      - name: cors
        config:
          origins:
            - "__CORS_ORIGIN__"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
            - apikey
            - x-supabase-api-version
            - x-client-info
            - accept-profile
            - content-profile
            - prefer
            - Range
            - Origin
            - Referer
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
          exposed_headers:
            - Content-Length
            - Content-Range
            - accept-ranges
            - Content-Type
            - Content-Profile
            - Range-Unit
          credentials: true
          max_age: 3600
  - name: auth-v1-admin
    url: http://__PROJECT_NAME__-auth:9999/admin
    routes:
      - name: auth-v1-admin-route
        paths:
          - /auth/v1/admin
    plugins:
      - name: cors
        config:
          origins:
            - "__CORS_ORIGIN__"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
            - apikey
            - x-supabase-api-version
            - x-client-info
            - accept-profile
            - content-profile
            - prefer
            - Range
            - Origin
            - Referer
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
          exposed_headers:
            - Content-Length
            - Content-Range
            - accept-ranges
            - Content-Type
            - Content-Profile
            - Range-Unit
          credentials: true
          max_age: 3600
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  - name: rest
    url: http://__PROJECT_NAME__-rest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1
    plugins:
      - name: cors
