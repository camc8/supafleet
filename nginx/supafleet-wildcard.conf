map $host $instance_studio_port {
    include /etc/nginx/multibase-studio-ports/*.conf;
    default 0;
}

map $host $instance_kong_port {
    include /etc/nginx/multibase-kong-ports/*.conf;
    default 0;
}

server {
    listen 80;
    server_name *.db.xcorpllc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.db.xcorpllc.com;

    ssl_certificate     /etc/letsencrypt/live/db.xcorpllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.xcorpllc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($instance_studio_port = 0) { return 404; }
    if ($instance_kong_port = 0)   { return 404; }

    location = /auth/verify {
        internal;
        proxy_pass http://127.0.0.1:4000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location @login_redirect {
        return 302 https://db.xcorpllc.com/auth/login?rd=https://$host$request_uri;
    }

    # Redirect old /studio paths to root (backwards compat)
    location ~ ^/studio(/.*)?$ {
        return 301 https://$host$1;
    }

    # Kong: Supabase API endpoints
    location ~ ^/(rest|auth|storage|functions|realtime|analytics|graphql)/v1 {
        proxy_pass http://localhost:$instance_kong_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Studio: everything else (at root, no path stripping needed)
    location / {
        auth_request /auth/verify;
        error_page 401 = @login_redirect;

        proxy_pass http://localhost:$instance_studio_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
