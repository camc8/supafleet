# Supafleet wildcard routing: {instance}.{{BASE_DOMAIN}} -> instance containers
# Replace {{BASE_DOMAIN}} and {{DASHBOARD_DOMAIN}} with your values (setup.sh does this)

map $host $instance_studio_port {
    include /etc/nginx/supafleet-studio-ports/*.conf;
    default 0;
}

map $host $instance_kong_port {
    include /etc/nginx/supafleet-kong-ports/*.conf;
    default 0;
}

server {
    listen 80;
    server_name *.{{BASE_DOMAIN}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.{{BASE_DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{BASE_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{BASE_DOMAIN}}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($instance_studio_port = 0) { return 404; }
    if ($instance_kong_port = 0)   { return 404; }

    location = /auth/verify {
        internal;
        proxy_pass http://127.0.0.1:4000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location @login_redirect {
        return 302 https://{{DASHBOARD_DOMAIN}}/auth/login?rd=https://$host$request_uri;
    }

    location = /studio { return 302 https://$host/studio/project/default; }

    location /studio {
        auth_request /auth/verify;
        error_page 401 = @login_redirect;
        rewrite ^/studio(/.*)$ $1 break;
        proxy_pass http://localhost:$instance_studio_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript;
        sub_filter '/_next/' '/studio/_next/';
        sub_filter '"isFallback":false' '"isFallback":false,"basePath":"/studio"';
    }

    location = / { return 302 https://$host/studio; }

    location / {
        proxy_pass http://localhost:$instance_kong_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
